name: Daily Telegram Greeting

on:
  schedule:
    # 04:30 UTC is exactly 10:00 AM IST
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger to test immediately

jobs:
  send-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Added pytz for precise timezone handling
        run: pip install requests pytz

      - name: Run Greeting Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_greeting.py
