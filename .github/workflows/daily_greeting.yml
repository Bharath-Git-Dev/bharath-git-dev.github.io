name: Daily Datetime Logger

on:
  schedule:
    # 04:30 UTC is exactly 10:00 AM IST
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger to test immediately

jobs:
  log-datetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Removed requests since the script no longer uses it
        run: pip install pytz

      - name: Run Logger Script
        # Make sure your Python file name matches this exactly
        run: python daily_greeting.py

      - name: Commit and Push CSV changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add datetime_log.csv
          git commit -m "chore: auto-update datetime log [skip ci]" || echo "No changes to commit"
          git push
