<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharath Portfolio | Project Architecture</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0 0 2.5rem 0;
        }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        a {
            color: var(--text-main);
            text-decoration: none;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--card-bg);
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
        a:hover {
            border-color: var(--accent);
            background-color: #0284c715;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>System Architecture Portfolio</h1>
        <p class="subtitle">Select a project case study below to explore structural schematics</p>
        <div class="links-grid">
            <a href="epam/">Novartis Project Design @ EPAM</a>
            <a href="infosys/">Nike Project Design @ Infosys</a>
        </div>
    </div>
</body>
</html>
