# yml for Gold Tracker
name: Hourly Gold Tracker

on:
  schedule:
    # Runs exactly at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  track-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Tracker and Check Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_tracker.py

      - name: Save CSV Data back to Repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Gold Tracker Bot"
          git add gold_prices.csv
          git commit -m "data: hourly gold price update [skip ci]" || echo "No changes"
          git push
